services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "5433:5432"
    volumes:
      - tasks_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TASKS_HTTP_PORT: "8081"
      TASKS_DB_HOST: postgres
      TASKS_DB_PORT: "5432"
      TASKS_DB_USER: tasks
      TASKS_DB_PASSWORD: tasks
      TASKS_DB_NAME: tasks
      TASKS_DB_SSLMODE: disable
      TASKS_KAFKA_BROKERS: kafka:29092
      TASKS_KAFKA_TOPIC: tasks.events
      TASKS_TIMEZONE: Europe/Moscow
      TASKS_WINDOW_DAYS: "60"
    networks:
      - default
      - ecosystem
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  tasks_pg_data:

networks:
  ecosystem:
    external: true
